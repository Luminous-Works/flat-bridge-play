  <path d="M15.2 9.5 L18.8 9.5 M14.6 12 L19.4 12 M14.8 14.5 L19.2 14.5" stroke="#7a6034" stroke-width="0.5"/>
  <ellipse cx="17" cy="20.5" rx="3.8" ry="4.4" fill="url(#lamp)"/>
  <path d="M14 19 L20 19 M14.3 21.5 L19.7 21.5" stroke="#b9e05a" stroke-width="0.5" opacity="0.8"/>
