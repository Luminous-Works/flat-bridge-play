    <radialGradient id="halo"><stop offset="0" stop-color="#f6ffb8" stop-opacity="0.95"/><stop offset="0.35" stop-color="#b8ff66" stop-opacity="0.55"/><stop offset="1" stop-color="#3cff8c" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.4"><stop offset="0" stop-color="#ffffe0"/><stop offset="0.6" stop-color="#e8ff7a"/><stop offset="1" stop-color="#9ad83a"/></radialGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a4626"/><stop offset="1" stop-color="#1e150a"/></linearGradient>
  </defs>
  <circle cx="17" cy="19" r="16" fill="url(#halo)"/>
  <!-- wings -->
  <path d="M15 12 C8 5 3 9 5 13 C8 15 12 14 15 13 Z" fill="#e6f4ff" fill-opacity="0.55" stroke="#c9dcea" stroke-width="0.4"/>
